allow_managed_hooks_only = true

[features]
hooks = true

[hooks]
windows_managed_dir = 'C:\Program Files\Cisco\Cisco Secure Client\DefenseClaw\bin'

[[hooks.PermissionRequest]]
matcher = '*'

[[hooks.PermissionRequest.hooks]]
command = '%SYSTEM32%\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand '
command_windows = '%SYSTEM32%\WindowsPowerShell\v1.0\powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand '
timeout = 30
type = 'command'

[[hooks.PostCompact]]
[[hooks.PostCompact.hooks]]
